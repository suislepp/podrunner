apiVersion: v1
kind: Pod
metadata:
  name: __POD_NAME__
  labels:
    app: podrunner
    owner: __OWNER__
spec:
  restartPolicy: Never
  containers:
    - name: main
      image: python:__PYTHON_VERSION__-slim
      workingDir: /work
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
__ENV__
      command:
        - bash
        - -c
        - |
          echo "podrunner: waiting for run.py to copy the script in"
          timeout 1800 bash -c 'until [ -f /tmp/ready ]; do sleep 1; done' || exit 1
          if [ -f /tmp/env ]; then . /tmp/env; rm /tmp/env; fi
          set -o pipefail
          __COMMAND__ 2>&1 | tee /work/log.txt
          echo "podrunner: finished, exit code $?"
          echo "podrunner: keeping /work for watch.py for 24 h"
          sleep 86400
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi
